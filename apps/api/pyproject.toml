[project]
name = "insightscope-api"
version = "0.1.0"
description = "InsightScope — FastAPI backend for the Global Intelligence Dashboard"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pymongo>=4.13,<5",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pyright>=1.1.410,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a running MongoDB (set MONGODB_TEST_URI)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
